# Debug APK for a chosen ref. This file stays on the ci branch of the fork.
# The DVD-structure pull request does not contain it. Run from that branch:
#   gh workflow run android.yml --ref ci -f ref=dvd-structure
name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: dvd-structure
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: android-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: arm64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          submodules: false

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 36 and NDK 29
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK" >&2
            exit 1
          fi
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)
          if [ -z "$SM" ]; then
            echo "sdkmanager missing under $SDK/cmdline-tools" >&2
            find "$SDK" -maxdepth 3 -type d >&2
            exit 1
          fi
          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK/licenses/android-sdk-license"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$SDK/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake python3 pkg-config

      - name: FEX and native dependencies
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- external/fex
          git -C external/fex submodule update --init --depth 1 -- \
            External/fmt External/range-v3 External/rpmalloc \
            External/unordered_dense External/xxhash Source/Common/cpp-optparse

          deps="$GITHUB_WORKSPACE/native-deps"
          clone_tag() {
            git clone --depth 1 --branch "$3" "$1" "$2"
          }
          clone_sha() {
            mkdir -p "$(dirname "$2")"
            git init "$2"
            git -C "$2" remote add origin "$1"
            git -C "$2" fetch --depth 1 origin "$3"
            git -C "$2" checkout --detach FETCH_HEAD
          }
          clone_tag https://github.com/zeux/volk.git "$deps/volk" 1.4.304
          clone_tag https://github.com/KhronosGroup/glslang.git "$deps/glslang" 16.1.0
          clone_tag https://github.com/KhronosGroup/SPIRV-Reflect.git "$deps/spirv_reflect" vulkan-sdk-1.4.328.0
          clone_tag https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git "$deps/vma" v3.3.0
          clone_tag https://github.com/libsdl-org/SDL.git "$deps/SDL3" release-3.4.18
          clone_sha https://github.com/bylaws/libadrenotools.git "$deps/adrenotools" 8fae8ce254dfc1344527e05301e43f37dea2df80
          git -C "$deps/adrenotools" apply "$GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch"
          clone_sha https://github.com/xemu-project/nv2a_vsh_cpu.git "$deps/root/subprojects/nv2a_vsh_cpu" 561fe80da57a881f89000256b459440c0178a7ce
          clone_sha https://github.com/qemu/libslirp.git "$deps/libslirp" 26be815b86e8d49add8c9a8b320239b9594ff03d
          echo "NC_DEPS=$deps" >> "$GITHUB_ENV"

      - name: Native core
        run: |
          set -euo pipefail
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DHAKUX_LTO=OFF \
            -DNC_DEPS="$NC_DEPS"
          ninja -C build/native/core hakuxcore
          bash tools/native/app-libs.sh

      - name: Debug APK
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          cd android
          chmod +x ./gradlew
          GRADLE_OPTS="-Xmx2g -Dfile.encoding=UTF-8" ./gradlew assembleDebug --no-daemon --stacktrace
        id: apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hakux-debug-${{ steps.apk.outputs.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
